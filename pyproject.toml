[project]
name = "missing-wedge-ei"
version = "0.1.0"
description = "Equivariant imaging on a toy missing-wedge problem (PyTorch)"
readme = "README.md"
authors = [
    { name = "Noeinho" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
